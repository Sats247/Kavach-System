<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DBMS — NGO Support Portal</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/ngo-portal.css">
</head>

<body>
  <div class="app-shell">
    <nav class="sidebar">
      <div class="sidebar-brand">
        <img src="/svg/dbms-logo.svg" style="width:32px;height:32px" alt="DBMS">
        <div>
          <div class="sidebar-brand-text">DBMS</div>
          <div class="sidebar-brand-sub">NGO Support Portal</div>
        </div>
      </div>
      <div class="sidebar-nav">
        <a href="/pages/ngo-portal.html" class="nav-item active"><img src="/svg/icons/heart-svgrepo-com.svg"
            style="width:16px;filter:invert(1)" alt=""><span>Assignments</span></a>
        <a href="/pages/refugee-portal.html" class="nav-item"><img src="/svg/icons/refugeeimmigrant.svg"
            style="width:16px;filter:invert(1)" alt=""><span>Refugee Portal</span></a>
      </div>
      <div class="sidebar-bottom">
        <div class="lang-pills">
          <button class="lang-pill active" data-lang="en">EN</button>
          <button class="lang-pill" data-lang="hi">हि</button>
        </div>
        <div class="sidebar-user" id="sidebar-user-info">NGO User</div>
        <button class="btn btn-secondary" id="logout-btn" style="width:100%;font-size:11px">← Logout</button>
      </div>
    </nav>
    <div class="main-content">
      <header class="top-header">
        <div class="breadcrumb">NGO Portal › <strong>Humanitarian Coordination</strong></div>
        <div class="header-right">
          <div class="live-clock" id="live-clock">—</div>
          <div class="system-badge">Live Feed</div>
        </div>
      </header>
      <main class="content-area">
        <div class="page-header">
          <div>
            <h1 class="page-title" data-i18n="ngo.title">NGO Support Portal</h1>
            <p class="page-subtitle" data-i18n="ngo.subtitle">Humanitarian Coordination Dashboard — Incoming refugee
              assignments from border forces</p>
          </div>
          <div class="page-header-actions">
            <button class="btn btn-secondary" id="btn-refresh"
              onclick="loadAssignments();loadCounts();showToast('Refreshed','info')">↻ Refresh</button>
          </div>
        </div>

        <!-- Assignment Count Summary -->
        <div class="ngo-stats">
          <div class="ngo-stat" style="border-left:4px solid var(--color-warning)">
            <div class="ngo-stat-num text-warning" id="count-pending">—</div>
            <div class="ngo-stat-label">Pending</div>
          </div>
          <div class="ngo-stat" style="border-left:4px solid var(--color-info)">
            <div class="ngo-stat-num" id="count-acknowledged" style="color:var(--color-info)">—</div>
            <div class="ngo-stat-label">Acknowledged</div>
          </div>
          <div class="ngo-stat" style="border-left:4px solid var(--color-primary)">
            <div class="ngo-stat-num text-primary" id="count-in-progress" style="color:var(--color-primary)">—</div>
            <div class="ngo-stat-label">In Progress</div>
          </div>
          <div class="ngo-stat" style="border-left:4px solid var(--color-success)">
            <div class="ngo-stat-num text-success" id="count-completed">—</div>
            <div class="ngo-stat-label">Completed</div>
          </div>
        </div>

        <!-- Filter bar -->
        <div class="filter-bar">
          <label class="form-label" style="white-space:nowrap" data-i18n="ngo.filter_label">Filter by Status</label>
          <select id="filter-status" style="width:180px">
            <option value="">All Assignments</option>
            <option value="Pending">Pending</option>
            <option value="Acknowledged">Acknowledged</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
          </select>
        </div>

        <!-- Assignments Feed -->
        <div class="assignments-feed" id="assignments-container">
          <p style="color:var(--color-text-muted);padding:16px">Loading assignments...</p>
        </div>
      </main>
    </div>
  </div>
  <div id="toast-container"></div>
  <script src="/js/config.js"></script>
  <script src="/js/translation.js"></script>
  <script src="/js/ui-components.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ngo-portal.js"></script>
</body>

</html>
